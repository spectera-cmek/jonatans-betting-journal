name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # `prisma generate` resolves the datasource env vars but never connects, so
    # placeholders are enough. They must be set at job level because `npm ci`
    # triggers `postinstall` -> `npm run generate`, which reads both schemas.
    # The tests are pure unit tests (vitest `environment: node`) and touch no DB.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
      SHOTS_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SHOTS_DATABASE_URL_UNPOOLED: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
