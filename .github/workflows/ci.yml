name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Prisma needs a syntactically valid connection string to generate the
      # client and to type-check the build. Nothing here connects, so the value
      # is deliberately unreachable rather than a real database.
      #
      # This used to be "file:./dev.db" — a SQLite URL against a Postgres
      # schema, which `prisma db push` could not have accepted.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate
        env:
          SHOTS_DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"
          SHOTS_DATABASE_URL_UNPOOLED: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npx next build
